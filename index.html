<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Referencias ECI — Catálogo Apple</title>
<style>
  :root {
    --bg: #0d0d0f;
    --panel: #17171b;
    --panel-2: #1f1f24;
    --border: #2b2b31;
    --text: #eaeaef;
    --text-dim: #9a9aa5;
    --accent: #0a84ff;
    --accent-2: #64d2ff;
    --acc-warn: #ff9f0a;
    --acc-warn-bg: rgba(255,159,10,0.12);
    --acc-warn-border: rgba(255,159,10,0.4);
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100%;
  }
  a { color: var(--accent-2); }
  .app { display: flex; min-height: 100vh; }
  .sidebar {
    width: 280px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 16px 12px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  .sidebar h1 {
    font-size: 16px;
    margin: 4px 8px 14px 8px;
    color: var(--text);
    letter-spacing: 0.2px;
  }
  .sidebar h1 span {
    display: block;
    font-size: 11px;
    color: var(--text-dim);
    font-weight: 400;
    margin-top: 2px;
  }
  .nav-search {
    width: 100%;
    padding: 8px 10px;
    margin-bottom: 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-size: 13px;
    outline: none;
  }
  .nav-search:focus { border-color: var(--accent); }
  .nav-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13.5px;
    margin-bottom: 2px;
    transition: background 0.15s, color 0.15s;
  }
  .nav-btn:hover { background: var(--panel-2); color: var(--text); }
  .nav-btn.active { background: var(--accent); color: white; font-weight: 600; }
  .main { flex: 1; padding: 24px 32px; min-width: 0; }
  .topbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 18px;
  }
  .topbar h2 { font-size: 22px; margin: 0; flex: 1; min-width: 200px; }
  .stat-pill {
    background: var(--panel-2);
    border: 1px solid var(--border);
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--text-dim);
  }
  .controls {
    display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px;
  }
  .controls input[type="text"] {
    flex: 1; min-width: 220px; padding: 10px 14px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    font-size: 14px; outline: none;
  }
  .controls input[type="text"]:focus { border-color: var(--accent); }
  .btn {
    padding: 10px 16px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text); font-size: 13.5px; cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); }

  .section-block {
    margin-bottom: 22px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--panel);
  }
  .section-block.accessory {
    border: 1px dashed var(--acc-warn-border);
    background: var(--acc-warn-bg);
  }
  .section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    background: var(--panel-2);
    cursor: pointer;
    user-select: none;
  }
  .section-block.accessory .section-header {
    background: rgba(255,159,10,0.18);
  }
  .section-header .toggle-icon {
    font-size: 11px;
    color: var(--text-dim);
    transition: transform 0.15s;
    width: 12px;
  }
  .section-header.collapsed .toggle-icon { transform: rotate(-90deg); }
  .section-title {
    font-size: 15px;
    font-weight: 600;
    flex: 1;
  }
  .accessory-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--acc-warn);
    color: #1a1200;
    font-size: 11.5px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
    letter-spacing: 0.2px;
  }
  .section-count {
    font-size: 12px;
    color: var(--text-dim);
  }
  .section-body { overflow-x: auto; }
  .section-body.collapsed { display: none; }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  thead th {
    background: rgba(255,255,255,0.03);
    color: var(--text-dim);
    text-align: left;
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  tbody td {
    padding: 8px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    vertical-align: top;
    color: #111;
  }
  tbody tr:last-child td { border-bottom: none; }
  .mono { font-variant-numeric: tabular-nums; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .cell-plain { background: transparent !important; color: var(--text) !important; }
  mark { background: #ffd60a; color: #1a1a1a; border-radius: 3px; padding: 0 2px; }

  .empty-state { padding: 40px; text-align: center; color: var(--text-dim); }

  /* Matrix (Pencil & Keyboard) view */
  .matrix-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel); }
  .matrix-wrap table thead th { position: sticky; top: 0; background: var(--panel-2); z-index: 2; }
  .matrix-wrap td.accessory-name { font-weight: 600; color: var(--text) !important; background: var(--panel-2) !important; }
  .matrix-wrap td.pn-cell { color: var(--text-dim) !important; background: var(--panel-2) !important; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }

  footer { margin-top: 20px; color: var(--text-dim); font-size: 12px; text-align: center; }

  @media (max-width: 900px) {
    .app { flex-direction: column; }
    .sidebar { width: 100%; height: auto; position: relative; max-height: 260px; border-right: none; border-bottom: 1px solid var(--border); }
    .main { padding: 16px; }
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--panel); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }
  ::-webkit-scrollbar-thumb:hover { background: #3a3a42; }
</style>
</head>

const SHEET_NAMES = Object.keys(DATA);
let currentSheet = SHEET_NAMES[0];

function filterNav() {
  const q = document.getElementById('navSearch').value.toLowerCase();
  document.querySelectorAll('.nav-btn').forEach(btn => {
    const name = btn.dataset.sheet.toLowerCase();
    btn.style.display = name.includes(q) ? '' : 'none';
  });
}

function selectSheet(name) {
  currentSheet = name;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.sheet === name));
  document.getElementById('sheetTitle').textContent = name;
  document.getElementById('searchBox').value = '';
  renderTable();
  const url = new URL(window.location);
  url.hash = encodeURIComponent(name);
  history.replaceState(null, '', url);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function highlightMatch(text, query) {
  if (!query) return escapeHtml(text);
  const escaped = escapeHtml(text);
  const q = query.toLowerCase();
  const lower = escaped.toLowerCase();
  const idx = lower.indexOf(q);
  if (idx === -1) return escaped;
  return escaped.slice(0, idx) + '<mark>' + escaped.slice(idx, idx + q.length) + '</mark>' + escaped.slice(idx + q.length);
}

function luminance(hex) {
  if (!hex) return 1;
  const r = parseInt(hex.substr(0,2),16)/255;
  const g = parseInt(hex.substr(2,2),16)/255;
  const b = parseInt(hex.substr(4,2),16)/255;
  const lin = c => c <= 0.04045 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4);
  return 0.2126*lin(r) + 0.7152*lin(g) + 0.0722*lin(b);
}

function cellStyle(color) {
  if (!color) return '';
  const lum = luminance(color);
  const textColor = lum < 0.5 ? '#fff' : '#111';
  return `background:#${color}; color:${textColor};`;
}

function rowMatches(row, query) {
  if (!query) return true;
  return row.some(cell => String(cell.v || '').toLowerCase().includes(query));
}

function renderTableSection(sheetDef, query) {
  const isMatrix = sheetDef.type === 'matrix';
  if (isMatrix) return renderMatrix(sheetDef, query);

  let html = '';
  let totalVisible = 0;
  sheetDef.sections.forEach((sec, idx) => {
    const visibleRows = sec.rows.filter(r => rowMatches(r, query));
    if (query && visibleRows.length === 0) return;
    totalVisible += visibleRows.length;

    const sectionId = 'sec-' + idx;
    const accClass = sec.is_accessory ? ' accessory' : '';
    const badge = sec.is_accessory ? '<span class="accessory-badge">🔌 Accesorios recomendados</span>' : '';
    const titleText = sec.title || '(Sin título)';

    let rowsHtml = '';
    visibleRows.forEach(row => {
      const cells = row.map((cell, ci) => {
        const style = cellStyle(cell.color);
        const isCode = sec.columns[ci] && ['P/N','ECI','EAN'].includes(sec.columns[ci]);
        const cls = isCode ? 'mono' : '';
        return `<td class="${cls}" style="${style}">${highlightMatch(cell.v, query)}</td>`;
      }).join('');
      rowsHtml += `<tr>${cells}</tr>`;
    });

    const headHtml = sec.columns.map(c => `<th>${escapeHtml(c)}</th>`).join('');

    html += `
    <div class="section-block${accClass}" data-section="${sectionId}">
      <div class="section-header" onclick="toggleSection('${sectionId}')">
        <span class="toggle-icon" id="icon-${sectionId}">▼</span>
        <span class="section-title">${escapeHtml(titleText)}</span>
        ${badge}
        <span class="section-count">${visibleRows.length} ref.</span>
      </div>
      <div class="section-body" id="body-${sectionId}">
        <table>
          <thead><tr>${headHtml}</tr></thead>
          <tbody>${rowsHtml || '<tr><td colspan="4" class="empty-state">Sin resultados</td></tr>'}</tbody>
        </table>
      </div>
    </div>`;
  });

  if (totalVisible === 0 && query) {
    html = '<div class="empty-state">No se han encontrado resultados para "' + escapeHtml(query) + '".</div>';
  }
  document.getElementById('rowCount').textContent = totalVisible + ' filas visibles';
  return html;
}

function renderMatrix(sheetDef, query) {
  const visibleRows = sheetDef.rows.filter(r => rowMatches(r, query));
  document.getElementById('rowCount').textContent = visibleRows.length + ' filas';
  const headHtml = sheetDef.columns.map(c => `<th>${escapeHtml(c)}</th>`).join('');
  let rowsHtml = '';
  visibleRows.forEach(row => {
    const cells = row.map((cell, ci) => {
      const style = cellStyle(cell.color);
      let cls = '';
      if (ci === 0) cls = 'accessory-name';
      else if (ci === 1) cls = 'pn-cell';
      return `<td class="${cls}" style="${ci<=1 ? '' : style}">${highlightMatch(cell.v, query)}</td>`;
    }).join('');
    rowsHtml += `<tr>${cells}</tr>`;
  });
  return `<div class="matrix-wrap"><table><thead><tr>${headHtml}</tr></thead><tbody>${rowsHtml || '<tr><td colspan="8" class="empty-state">Sin resultados</td></tr>'}</tbody></table></div>`;
}

function renderTable() {
  const sheetDef = DATA[currentSheet];
  const query = document.getElementById('searchBox').value.trim().toLowerCase();
  document.getElementById('content').innerHTML = renderTableSection(sheetDef, query);
}

function toggleSection(id) {
  const body = document.getElementById('body-' + id);
  const icon = document.getElementById('icon-' + id);
  const collapsed = body.classList.toggle('collapsed');
  icon.parentElement.classList.toggle('collapsed', collapsed);
}

function expandAll() {
  document.querySelectorAll('.section-body').forEach(b => b.classList.remove('collapsed'));
  document.querySelectorAll('.section-header').forEach(h => h.classList.remove('collapsed'));
}
function collapseAll() {
  document.querySelectorAll('.section-body').forEach(b => b.classList.add('collapsed'));
  document.querySelectorAll('.section-header').forEach(h => h.classList.add('collapsed'));
}

function clearFilters() {
  document.getElementById('searchBox').value = '';
  renderTable();
}

const initial = decodeURIComponent(window.location.hash.slice(1));
selectSheet(SHEET_NAMES.includes(initial) ? initial : SHEET_NAMES[0]);
</script>
